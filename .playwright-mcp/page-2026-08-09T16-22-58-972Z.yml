              - generic [ref=f1e222]:
                - paragraph [ref=f1e223]:
                  - text: Infertility affects 10%–15% of couples worldwide who are trying to conceive (
                  - link "Reference 1" [ref=f1e225] [cursor=pointer]:
                    - /url: "#"
                    - text: "1"
                  - text: ), and in approximately half of these couples, a male (co)factor is causally relevant (
                  - link "Reference 1" [ref=f1e227] [cursor=pointer]:
                    - /url: "#"
                    - text: "1"
                  - text: ","
                  - link "Reference 2" [ref=f1e229] [cursor=pointer]:
                    - /url: "#"
                    - text: "2"
                  - text: ). Clinically, male infertility is diagnosed according to World Health Organization recommendations by assessing sperm count, concentration, morphology, and motility (
                  - link "Reference 3" [ref=f1e231] [cursor=pointer]:
                    - /url: "#"
                    - text: "3"
                  - text: ). The most severe form of male infertility is azoospermia, which is characterized by the absence of sperm in the ejaculate; azoospermia is estimated to account for 10%–15% of male infertility cases (
                  - link "Reference 4" [ref=f1e233] [cursor=pointer]:
                    - /url: "#"
                    - text: "4"
                  - text: ). Although azoospermia is thought to have mostly genetic causes (
                  - link "Reference 5" [ref=f1e235] [cursor=pointer]:
                    - /url: "#"
                    - text: "5"
                  - text: ), only approximately 20% of affected men receive a diagnosis by karyotyping (e.g., Klinefelter syndrome, 47, XXY) and Y-chromosomal azoospermia factor deletion testing (
                  - link "Reference 4" [ref=f1e237] [cursor=pointer]:
                    - /url: "#"
                    - text: "4"
                  - text: ). In recent years, more and more genes have been identified in which variants are monogenic causes of azoospermia (e.g., TEX11 (
                  - link "Reference 6" [ref=f1e239] [cursor=pointer]:
                    - /url: "#"
                    - text: "6"
                  - text: ), FANCM (
                  - link "Reference 7" [ref=f1e241] [cursor=pointer]:
                    - /url: "#"
                    - text: "7"
                  - text: ), M1AP (
                  - link "Reference 8" [ref=f1e243] [cursor=pointer]:
                    - /url: "#"
                    - text: "8"
                  - text: ), reviewed in (
                  - link "Reference 9" [ref=f1e245] [cursor=pointer]:
                    - /url: "#"
                    - text: "9"
                  - text: )). We recently proposed analyzing a validated panel of 21 genes to increase the diagnostic yield by 4%–6% (
                  - link "Reference 10" [ref=f1e247] [cursor=pointer]:
                    - /url: "#"
                    - text: "10"
                  - text: ), but many genetic causes for severe spermatogenic failure remain unclear. Furthermore, numerous identified variants are primarily of uncertain significance (VUS) based on in silico predictions, warranting functional in vitro analyses.
                - paragraph [ref=f1e248]:
                  - text: One of the genes in which variants have been described in association with male infertility is Doublesex and mab-3-related transcription factor 1 (DMRT1) (
                  - link "11–13" [ref=f1e250] [cursor=pointer]:
                    - /url: "#"
                  - text: ). The DMRT1 protein is known to play essential roles in early gonadal development in mice and men and also in the maintenance of fertility in male mice (
                  - link "14–18" [ref=f1e252] [cursor=pointer]:
                    - /url: "#"
                  - text: "). DMRT1 has 2 functional domains: The highly conserved zinc finger “DM” domain is involved in the protein’s DNA-binding activity ("
                  - link "Reference 19" [ref=f1e254] [cursor=pointer]:
                    - /url: "#"
                    - text: "19"
                  - text: ","
                  - link "Reference 20" [ref=f1e256] [cursor=pointer]:
                    - /url: "#"
                    - text: "20"
                  - text: ) and was first identified in the proteins DSX and MAB-3, regulating sexual differentiation in Drosophila melanogaster and Caenorhabditis elegans (
                  - link "Reference 17" [ref=f1e258] [cursor=pointer]:
                    - /url: "#"
                    - text: "17"
                  - text: ","
                  - link "Reference 21" [ref=f1e260] [cursor=pointer]:
                    - /url: "#"
                    - text: "21"
                  - text: ","
                  - link "Reference 22" [ref=f1e262] [cursor=pointer]:
                    - /url: "#"
                    - text: "22"
                  - text: ). The second functional motif has been termed the “DMRT1” domain, but its function remains unknown.
                - paragraph [ref=f1e263]:
                  - text: In adult male mice, Dmrt1 is expressed exclusively in the testis in Sertoli cells as well as germ cells, particularly in undifferentiated spermatogonia (
                  - link "Reference 16" [ref=f1e265] [cursor=pointer]:
                    - /url: "#"
                    - text: "16"
                  - text: ). Dmrt1 knockout mice have small testes and abnormal testicular morphology, where germ cells disappear soon after birth and Sertoli cells are dysfunctional (
                  - link "Reference 23" [ref=f1e267] [cursor=pointer]:
                    - /url: "#"
                    - text: "23"
                  - text: ","
                  - link "Reference 24" [ref=f1e269] [cursor=pointer]:
                    - /url: "#"
                    - text: "24"
                  - text: ). In genetically female mice, overexpression of a Dmrt1 transgene leads to complete sex reversal of the fetal gonads (
                  - link "Reference 25" [ref=f1e271] [cursor=pointer]:
                    - /url: "#"
                    - text: "25"
                  - text: ), underlining the importance of the right timing and dosage of DMRT1 in gonadal development to achieve normal fertility. In humans, spatiotemporal expression of DMRT1 in the testis is very similar (
                  - link "Reference 14" [ref=f1e273] [cursor=pointer]:
                    - /url: "#"
                    - text: "14"
                  - text: ","
                  - link "Reference 15" [ref=f1e275] [cursor=pointer]:
                    - /url: "#"
                    - text: "15"
                  - text: ","
                  - link "Reference 18" [ref=f1e277] [cursor=pointer]:
                    - /url: "#"
                    - text: "18"
                  - text: ). Heterozygous deletions or other variants resulting in partial loss of DMRT1 function lead to differences in sex development (DSD) (
                  - link "26–28" [ref=f1e279] [cursor=pointer]:
                    - /url: "#"
                  - text: ). In DMRT1-associated XY-DSD, subjects with normal male karyotypes show partly or completely feminized internal and external genitalia, also resulting in infertility (
                  - link "Reference 29" [ref=f1e281] [cursor=pointer]:
                    - /url: "#"
                    - text: "29"
                  - text: ). A milder phenotype of DMRT1 deficiency has been proposed as well, with overall intact male phenotypic characteristics but isolated spermatogenic failure, azoospermia, and infertility (
                  - link "11–13" [ref=f1e283] [cursor=pointer]:
                    - /url: "#"
                  - text: ","
                  - link "Reference 30" [ref=f1e285] [cursor=pointer]:
                    - /url: "#"
                    - text: "30"
                  - text: ).
                - paragraph [ref=f1e286]: So far, no DMRT1 variants related to azoospermia have been functionally analyzed. In this study, we established luciferase assays using 2 different DMRT1 target promoters and characterized 13 missense variants in DMRT1, finding a pronounced functional effect for 3 variants. These assays will not only help improve the understanding of the biological processes involved in gonadal development, spermatogenesis, and infertility, but will also help clarify uncertain genetic/clinical diagnoses.
                - generic [ref=f1e287]:
                  - heading "Materials and methods" [level=2] [ref=f1e288]
                  - generic [ref=f1e289]:
                    - heading "Study population" [level=3] [ref=f1e290]
                    - paragraph [ref=f1e291]:
                      - text: The Male Reproductive Genomics (MERGE) patient cohort has previously been described in detail (
                      - link "Reference 31" [ref=f1e293] [cursor=pointer]:
                        - /url: "#"
                        - text: "31"
                      - text: "). Briefly, it comprised 1,305 infertile men, of whom most attended the Centre of Reproductive Medicine and Andrology, University Hospital Münster, or the Clinic for Urology, Paediatric Urology and Andrology, University Hospital Gießen. Of all patients, 1,114 presented with severe spermatogenic failure but were otherwise healthy. The other 191 patients had unrelated infertility phenotypes (e.g., congenital bilateral aplasia of vas deferens or globozoospermia). Various well-known causes of infertility, such as malignant diseases, karyotype abnormalities, and azoospermia factor deletions, had been excluded. A total of 160 male subjects with intact spermatogenesis or unrelated phenotypes were included as controls in the study. All subjects gave written informed consent. The study protocol was approved by the respective ethics committees according to the Declaration of Helsinki (Münster: Kennzeichen 2010-578-f-S, Gießen: No. 26/11)."
                    - generic [ref=f1e294]:
                      - heading "Genetic analysis" [level=4] [ref=f1e295]
                      - paragraph [ref=f1e296]:
                        - text: Exome sequencing and filtering of the data were performed as described previously (
                        - link "Reference 31" [ref=f1e298] [cursor=pointer]:
                          - /url: "#"
                          - text: "31"
                        - text: ","
                        - link "Reference 32" [ref=f1e300] [cursor=pointer]:
                          - /url: "#"
                          - text: "32"
                        - text: ), with the modification that we queried rare missense variants in DMRT1 (NM_021951) with a minor allele frequency (MAF) <0.01 in the gnomAD database v2.1.1. All patients carrying missense variants in DMRT1 were also evaluated for relevant variants in other genes associated with spermatogenic failure, as previously described (
                        - link "Reference 33" [ref=f1e302] [cursor=pointer]:
                          - /url: "#"
                          - text: "33"
                        - text: ).
                      - generic [ref=f1e303]:
                        - heading "Plasmids and site-directed mutagenesis" [level=5] [ref=f1e304]
                        - paragraph [ref=f1e305]:
                          - text: The DMRT1 coding sequence (NM_021951) was purchased in the expression vector pcDNA3.1(+) (GenScript Biotech Corp., NJ). Mutant plasmids carrying patient-specific missense variants were created using QuikChange II XL Site-Directed Mutagenesis Kit according to the manufacturer’s instructions (Agilent Technologies Inc., CA). Mutagenesis primers are listed in
                          - link "Supplemental Table 1" [ref=f1e306] [cursor=pointer]:
                            - /url: "#supplementary-material"
                          - text: (available online). The coding sequence of all resulting DMRT1 mutants was confirmed via Sanger sequencing.
                      - generic [ref=f1e307]:
                        - heading "Luciferase reporter assays" [level=5] [ref=f1e308]
                        - paragraph [ref=f1e309]:
                          - text: HEK293T cells (DSMZ – German Collection of Microorganisms and Cell Cultures GmbH, Germany) were cultivated in Dulbecco's modified Eagle’s medium (Gibco, Thermo Fisher Scientific Inc., MA) supplemented with 10% fetal bovine serum (Sigma-Aldrich, MA) and 1% penicillin-streptomycin solution (Gibco) at 37°C and 5% CO
                          - subscript [ref=f1e310]: "2"
                          - text: . For luciferase assays, cells were seeded into a 24-well cell culture plate (Thermo Fisher Scientific) and transfection was conducted using X-tremeGENE 9 according to the manufacturer’s instructions at 90% confluency (Merck KGaA, Germany). DNA concentrations used were as follows (concentration tests,
                          - link "Supplemental Fig. 1" [ref=f1e311] [cursor=pointer]:
                            - /url: "#supplementary-material"
                          - text: ", available online): for the CYP19A1 assays, 400 ng/well each for pcDNA3.1+ empty vector, pcDNA3.1+ DMRT1 wild-type (WT) or mutant as well as pGL4.10 CYP19A1 promoter luc2 (containing ∼3.9 kb of human CYP19A1 5′ untranslated region directly upstream of the firefly luciferase coding sequence), 40 ng/well pGL4.74 TK Rluc (containing a constitutively active TK promoter controlling Renilla luciferase expression), and 20 ng/well pcDNA3.1+ NR5A1 (to stimulate CYP19A1 promoter activity, as described in ("
                          - link "Reference 34" [ref=f1e313] [cursor=pointer]:
                            - /url: "#"
                            - text: "34"
                          - text: )). The CYP19A1 promoter construct was provided by Li Wang, China (
                          - link "Reference 34" [ref=f1e315] [cursor=pointer]:
                            - /url: "#"
                            - text: "34"
                          - text: ). For the Stra8 assays, 400 ng/well each for pcDNA3.1+ empty vector, pcDNA3.1+ DMRT1 WT or mutant as well as 800 ng/well pGL4.10 Stra8 promoter luc2 (containing ∼1.6 kb of murine Stra8 5’ untranslated region) and 40 ng/well pGL4.74 TK Rluc were used. The Stra8 promoter construct was provided by Josephine Bowles and Chun-Wei Feng, Australia (
                          - link "Reference 35" [ref=f1e317] [cursor=pointer]:
                            - /url: "#"
                            - text: "35"
                          - text: ). At 2 hours after transfection, the medium was changed from OptiMEM (Gibco) for better transfection back to supplemented Dulbecco's modified Eagle’s medium. Stra8 promoter assays were stimulated with retinoic acid (1 μM, Sigma-Aldrich, R2625) in DMSO at 24 hours after transfection for another 24 hours. At 48 hours after transfection, cells were washed with phosphate-buffered saline and treated with Glo Lysis Buffer (Promega, WI), and luciferase assay measurements were performed with Promega Dual-Glo Luciferase Assay System kit according to the manufacturer’s instructions in a white Nunclon 96-well plate (Thermo Fisher Scientific) in a Tecan Infinite Lumi microplate reader (Tecan Group AG, Switzerland).
                  - generic [ref=f1e318]:
                    - heading "Statistical analysis" [level=3] [ref=f1e319]
                    - paragraph [ref=f1e320]: Firefly luciferase activity determined in relative light units was normalized for constitutive Renilla luciferase activity to correct for cell number per well and transfection efficiency. Results are depicted as Tukey’s box plots; experiments were performed in 9 biological and 2 technical replicates. Repeated measures one-way ANOVA was used, followed by Dunnett’s multiple comparisons test as correction using GraphPad Prism v9.3 (GraphPad Software Inc., USA) to determine statistical significance (P<.05).
                - generic [ref=f1e321]:
                  - heading "Results" [level=2] [ref=f1e322]
                  - generic [ref=f1e323]:
                    - heading "DMRT1 missense variants in infertile men" [level=3] [ref=f1e324]
                    - paragraph [ref=f1e325]:
                      - text: "In this study, we characterized 13 heterozygous missense variants in DMRT1: 10 were identified in exome sequencing data of 1,114 infertile men from the MERGE cohort, 1 (c.671A>G p.(Asn224Ser)) was published previously in 3 unrelated men, and 2 were published as causal for XY-DSD and used as positive controls ("
                      - link "Fig. 1" [ref=f1e326] [cursor=pointer]:
                        - /url: "#fig1"
                      - text: A,
                      - link "Table 1" [ref=f1e327] [cursor=pointer]:
                        - /url: "#tbl1"
                      - text: ", and"
                      - link "Supplemental Table 2" [ref=f1e328] [cursor=pointer]:
                        - /url: "#supplementary-material"
                      - text: ). Three variants were also found in the in-house controls or the Nijmegen fertile father cohort (
                      - link "Table 1" [ref=f1e329] [cursor=pointer]:
                        - /url: "#tbl1"
                      - text: ). Five of the variants affected highly conserved amino acids (
                      - link "Supplemental Fig. 2" [ref=f1e330] [cursor=pointer]:
                        - /url: "#supplementary-material"
                      - text: ). All of the affected patients exhibited severe spermatogenic failure, i.e., crypto- or azoospermia, with diverse testicular histological phenotypes. Of note, M1317, who was shown to be carrier of the de novo DMRT1 variant c.344T>A p.(Met115Lys), had the most severe phenotype of complete tubular hyalinization (complete lack of germ cells and Sertoli cells, also termed tubular atrophy/shadows;
                      - link "Supplemental Fig. 3" [ref=f1e331] [cursor=pointer]:
                        - /url: "#supplementary-material"
                      - text: ). All but 1 patient had reduced testicular volumes and elevated serum follicle-stimulating hormone levels, and some also showed reduced testosterone levels.
                    - figure [ref=f1e333]:
                      - link [ref=f1e334] [cursor=pointer]:
                        - /url: /cms/10.1016/j.fertnstert.2022.10.032/asset/ef24258e-9ddf-4121-b2d3-9f9df96e1b71/main.assets/gr1_lrg.jpg
                        - text: 
                        - img [ref=f1e335]
                      - button "Figure viewer" [ref=f1e337]
                      - generic [ref=f1e339]:
                        - text: Figure 1
                        - generic [ref=f1e340]:
                          - text: Several DMRT1 variants affect activation of DMRT1 target promoter regions in a novel luciferase reporter assay. (A) A mutation tolerance landscape for DMRT1 (NM_021951) was obtained from the MetaDome webserver (
                          - link "https://stuart.radboudumc.nl/metadome/" [ref=f1e341] [cursor=pointer]:
                            - /url: https://stuart.radboudumc.nl/metadome/
                          - text: "). Known functional domains of the protein: DM = DM DNA-binding domain; DMRT1 = DMRT1 domain. The pinheads detail amino acid substitutions found in DMRT1 (NP_068770). All variants were classified according to ACMG-AMP guidelines as likely benign (green), variants of uncertain significance (VUS; yellow), or (likely) pathogenic (red). In a luciferase assay, the promoters of (B) CYP19A1 and (C) Stra8 were used as DMRT1 targets to control the expression of the firefly luciferase reporter in HEK293T cells. Data are depicted as Tukey’s box plot showing values above or below 1.5 times the interquartile range as outliers (black dots). EV = empty vector; WT = wild-type, marked in black. The dashed line represents the average WT value set at 100%. N = 9. ∗P<.05; ∗∗P<.01; ∗∗∗P<.001; ∗∗∗∗P<.0001. Differences in sex development (DSD) variants are highlighted in red. ACMG-AMP = American College of Medical Genetics and Genomics and the Association for Molecular Pathology; VUS = variant of uncertain significance."
