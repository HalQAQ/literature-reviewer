                        - generic [ref=f1e506]:
                          - text: Table 1
                          - paragraph [ref=f1e507]: Heterozygous variants in DMRT1 identified in infertile men from the MERGE cohort.
                        - generic [ref=f1e508]:
                          - paragraph [ref=f1e509]:
                            - text: Patients from previous studies are marked in gray. Variants marked with ∗ were also found in the in-house controls or the Nijmegen fertile father control cohort. All variants are described in greater detail in
                            - link "Supplemental Table 2" [ref=f1e510] [cursor=pointer]:
                              - /url: "#supplementary-material"
                            - text: . Hypo = hypospermatogenesis; MAF = minor allele frequency; MERGE = Male Reproductive Genomics; RsA = round spermatid arrest; SCO = Sertoli cell-only phenotype; SpgA = spermatogonial arrest; TS = tubular shadows; NA = not available.
                          - generic [ref=f1e511]:
                            - generic [ref=f1e512]: a
                            - paragraph [ref=f1e514]: Semen analysis was performed for all patients (Azoo = azoospermia; Crypto = cryptozoospermia), and if biopsies were available, the patients' phenotypes were histologically assessed.
                          - generic [ref=f1e515]:
                            - generic [ref=f1e516]: b
                            - paragraph [ref=f1e518]: Testicular volume (right/left, reference value >12 mL each; bold font marks values outside the normal range).
                          - generic [ref=f1e519]:
                            - generic [ref=f1e520]: c
                            - paragraph [ref=f1e522]: Follicle-stimulating hormone (FSH, reference value 1-7 IU/L; bold font marks values outside the normal range).
                          - generic [ref=f1e523]:
                            - generic [ref=f1e524]: d
                            - paragraph [ref=f1e526]: Luteinizing hormone (LH, reference value 2-10 IU/L; bold font marks values outside the normal range).
                          - generic [ref=f1e527]:
                            - generic [ref=f1e528]: e
                            - paragraph [ref=f1e530]: Testosterone (T, reference value >12 nmol/L; bold font marks values outside the normal range).
                          - generic [ref=f1e531]:
                            - generic [ref=f1e532]: f
                            - paragraph [ref=f1e534]:
                              - text: "The predicted effect of each DMRT1 variant was estimated by 4 different pathogenicity prediction algorithms: CADD v1 ("
                              - link "https://cadd.gs.washington.edu/" [ref=f1e535] [cursor=pointer]:
                                - /url: https://cadd.gs.washington.edu/
                              - text: ), PolyPhen v2 (
                              - link "http://genetics.bwh.harvard.edu/pph2" [ref=f1e536] [cursor=pointer]:
                                - /url: http://genetics.bwh.harvard.edu/pph2
                              - text: ), SIFT v2 (
                              - link "https://sift.bii.a-star.edu.sg" [ref=f1e537] [cursor=pointer]:
                                - /url: https://sift.bii.a-star.edu.sg/
                              - text: ), and Mutation Taster v6 (
                              - link "http://www.mutationtaster.org" [ref=f1e538] [cursor=pointer]:
                                - /url: http://www.mutationtaster.org/
                              - text: ). For CADD, variants with higher values are more likely to be deleterious to protein function. For the others, D = damaging/deleterious/disease-causing; T = tolerated; B = benign; N = neutral.
                          - generic [ref=f1e539]:
                            - generic [ref=f1e540]: g
                            - paragraph [ref=f1e542]: MAF values as listed in the gnomAD database.
                        - list [ref=f1e544]:
                          - listitem [ref=f1e545]:
                            - link "Open table in a new tab" [ref=f1e546] [cursor=pointer]:
                              - /url: /action/showFullTableHTML?isHtml=true&tableId=tbl1&pii=S0015-0282%2822%2901982-3
                    - paragraph [ref=f1e547]: "To rule out alternative causes for the patients’ infertility, the exome data of men carrying DMRT1 variants were evaluated for potentially causal variants in other genes that have been reported in connection to spermatogenic failure. We identified 2 heterozygous variants: M2207 (carrier of DMRT1 c.194C>T p.(Ala65Val)) was also heterozygous for the missense variant c.1018A>T p.(Thr340Ser) in SOX8 that is classified as a VUS; M2180 (carrier of DMRT1 c.910G>A p.(Val304Met)) was also heterozygous for the splice variant c.-46-1G>A in SYCP2 that was likely pathogenic."
                    - generic [ref=f1e548]:
                      - heading "Luciferase assays demonstrate aberrant transcriptional activity of DMRT1 variants" [level=4] [ref=f1e549]
                      - paragraph [ref=f1e550]:
                        - text: "To functionally assess and distinguish pathogenic from benign variants, we established luciferase reporter assays for DMRT1 using 2 different target gene promoters: human CYP19A1 and murine Stra8. CYP19A1, on the one hand, is a known target of DMRT1 ("
                        - link "Reference 34" [ref=f1e552] [cursor=pointer]:
                          - /url: "#"
                          - text: "34"
                        - text: ) and encodes the enzyme aromatase, which is responsible for converting androgens to estrogen (
                        - link "Reference 36" [ref=f1e554] [cursor=pointer]:
                          - /url: "#"
                          - text: "36"
                        - text: ); therefore, repression of this gene is imperative for normal testicular development and spermatogenesis. The DMRT1 target STRA8 (
                        - link "Reference 16" [ref=f1e556] [cursor=pointer]:
                          - /url: "#"
                          - text: "16"
                        - text: ","
                        - link "Reference 35" [ref=f1e558] [cursor=pointer]:
                          - /url: "#"
                          - text: "35"
                        - text: ), on the other hand, plays a crucial role in the initiation of meiosis in both male and female murine germ cells and may also be involved in gonadal development in Xenopus laevis (
                        - link "Reference 37" [ref=f1e560] [cursor=pointer]:
                          - /url: "#"
                          - text: "37"
                        - text: ","
                        - link "Reference 38" [ref=f1e562] [cursor=pointer]:
                          - /url: "#"
                          - text: "38"
                        - text: ). The murine Stra8 promoter construct was previously used to narrow down the location of the retinoic acid and DMRT1 binding sites. A consensus DMRT1 binding sequence identified in murine Stra8 promoter is also present in humans. Assays were performed with all 10 rare DMRT1 missense variants found in the MERGE cohort and 3 previously published variants (
                        - link "Tables 1" [ref=f1e563] [cursor=pointer]:
                          - /url: "#tbl1"
                        - text: and
                        - link "2" [ref=f1e564] [cursor=pointer]:
                          - /url: "#tbl2"
                        - text: ).
