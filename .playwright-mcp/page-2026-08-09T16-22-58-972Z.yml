                - generic [ref=f1e697]:
                  - heading "Discussion" [level=2] [ref=f1e698]
                  - paragraph [ref=f1e699]:
                    - text: Normal gonadal development requires the fine-tuned orchestration of a cascade of events. The determination of the bipotential gonad toward a testis starts with SRY expression and thereafter involves the transcriptional regulator DMRT1, which works to both activate and repress genes, promoting testis formation and repressing ovarian development. The critical role of DMRT1 in early gonadal development across mammals is well established (
                    - link "14–18" [ref=f1e701] [cursor=pointer]:
                      - /url: "#"
                    - text: ), as is the causal role of DMRT1 variants for XY-DSD (
                    - link "26–28" [ref=f1e703] [cursor=pointer]:
                      - /url: "#"
                    - text: ). Later, DMRT1 variants were also identified in men with isolated infertility because of unexplained spermatogenic failure, mostly azoospermia (
                    - link "Reference 11" [ref=f1e705] [cursor=pointer]:
                      - /url: "#"
                      - text: "11"
                    - text: ","
                    - link "Reference 12" [ref=f1e707] [cursor=pointer]:
                      - /url: "#"
                      - text: "12"
                    - text: ). However, all previous studies, including our own, have focused on the identification of DMRT1 variants followed by pathogenicity assessment, mostly based on in silico prediction and rarely corroborated by segregation analyses (
                    - link "10–13" [ref=f1e709] [cursor=pointer]:
                      - /url: "#"
                    - text: ","
                    - link "Reference 30" [ref=f1e711] [cursor=pointer]:
                      - /url: "#"
                      - text: "30"
                    - text: ","
                    - link "Reference 41" [ref=f1e713] [cursor=pointer]:
                      - /url: "#"
                      - text: "41"
                    - text: ). This leaves most variants as being of uncertain (clinical) significance and precludes a definitive diagnosis. Determining the true pathogenic relevance of identified variants warrants a functional in vitro assay that we have conceived, refined, validated, and applied in this study.
                  - paragraph [ref=f1e714]:
                    - text: We functionally characterized 13 heterozygous missense variants in DMRT1 in 2 luciferase assays using the human CYP19A1 and murine Stra8 promoters; the assays are complementary because WT DMRT1 represses the former and activates the latter. To establish and validate the assays, we analyzed the variants p.(Arg80Ser) and p.(Arg111Gly), which were previously reported as causal for DSD (
                    - link "Reference 20" [ref=f1e716] [cursor=pointer]:
                      - /url: "#"
                      - text: "20"
                    - text: ","
                    - link "Reference 39" [ref=f1e718] [cursor=pointer]:
                      - /url: "#"
                      - text: "39"
                    - text: ). Indeed, both variants showed strong and highly significant effects in either abrogating the repressing activity of DMRT1 on the CYP19A1 promoter, impairing the activating effect of DMRT1 on the Stra8 promoter, or both. Strikingly, the recently reported (
                    - link "Reference 10" [ref=f1e720] [cursor=pointer]:
                      - /url: "#"
                      - text: "10"
                    - text: ) DMRT1 de novo variant c.344T>A p.(Met115Lys) showed a complete loss of function in both assays. This variant, thus, exhibited the strongest effects of all analyzed variants, although the phenotype of isolated male infertility because of azoospermia is mild in comparison with DSD. Of note, all these variants are located in DMRT1’s DM domain, and it is conceivable that only variants in this domain affect transcriptional regulation that can be picked up in the assays. Taken together, this clearly highlights that the intricate interplay of transcription factors during gonadal development can only partially be mimicked and assessed using such in vitro assays. This is not surprising because DMRT1 is thought to regulate numerous genes. Indeed, more than 1,400 potential murine targets were identified through a ChIP/microarray study (
                    - link "Reference 42" [ref=f1e722] [cursor=pointer]:
                      - /url: "#"
                      - text: "42"
                    - text: ). Nevertheless, any measurable impact in these 2 assays points to potential biological relevance.
                  - paragraph [ref=f1e723]:
                    - text: Because of the high impact of p.(Met115Lys), we focused on this variant in more detail. The methionine residue in this position is highly conserved in homologous sequences from mouse, chicken, frog, and zebrafish. Furthermore, it is located in the major groove DNA recognition helix of DMRT1’s DM domain, and in silico structural modeling suggests that p.(Met115Lys) likely alters the specific hydrogen bond interactions with adjacent bases in the DNA-binding consensus site. Moreover, previous studies have shown that the variant p.(Met115Ala) had diminished DNA-binding activity in an electrophoretic mobility shift assay (
                    - link "Reference 20" [ref=f1e725] [cursor=pointer]:
                      - /url: "#"
                      - text: "20"
                    - text: ). Taken together, these analyses indicate that the variant p.(Met115Lys) disrupts binding to CYP19A1 and Stra8 promoters, thus causing their dysregulated transcription. The in-depth clinical characterization of the man M1317 carrying this variant is insightful because both the clinical and the testicular phenotypes are severe compared with those in other azoospermic men. Small testes, significantly elevated follicle-stimulating hormone levels, and lower testosterone levels are indicative of broad testicular dysfunction. In line with this, the histological evaluation of the testicular biopsy did not show the relatively common Sertoli cell-only phenotype but instead uniformly showed only rudiments of seminiferous tubules with hyalinized, thickened walls (tubular atrophy/shadows) devoid of germ and Sertoli cells.
                  - paragraph [ref=f1e726]:
                    - text: Interestingly, the variant p.(Arg111Gly), associated with DSD/sex reversal, and the variant p.(Met115Lys), associated with male phenotype/isolated testicular dysgenesis, are not only located closely together, but in the WT protein, Met115 stabilizes the position of Arg111 by forming van der Waals interactions (
                    - link "Reference 20" [ref=f1e728] [cursor=pointer]:
                      - /url: "#"
                      - text: "20"
                    - text: ). However, the DSD variant p.(Arg111Gly) not only causes reduced DNA affinity but also causes altered sequence specificity and stoichiometry of the DMRT1 protein complex (
                    - link "Reference 20" [ref=f1e730] [cursor=pointer]:
                      - /url: "#"
                      - text: "20"
                    - text: ), potentially explaining the significantly different severity of the associated phenotypes. Overall, one can speculate that the degree to which DMRT1’s regulation of CYP19A1, STRA8, and other genes is impaired may explain the wide spectrum of associated phenotypes—from sex reversal to isolated infertility—as has been shown for other similar transcription factors involved in gonadal development, most notably the genes NR5A1 and SOX8 (
                    - link "43–45" [ref=f1e732] [cursor=pointer]:
                      - /url: "#"
                    - text: "). These observations also point to a limitation inherent to all in vitro analyses: Even the most sophisticated assay will never be able to model the timing, dosage dependency, and full spectrum of effects of broadly relevant transcription factors such as DMRT1."
                  - paragraph [ref=f1e733]:
                    - text: In this regard, it should also be noted that the DMRT1 variants p.(Lys103Arg) and p.(Asp331His) showed slightly stronger repressive activity on the CYP19A1 promoter than the WT but no effect in the Stra8 assay. Both variants were also found 12 and 13 times, respectively, in the Dutch-proven father cohort, and p.(Asp331His) had been published previously in a man with intact spermatogenesis (
                    - link "Reference 12" [ref=f1e735] [cursor=pointer]:
                      - /url: "#"
                      - text: "12"
                    - text: ). In contrast, the variant p.(Asn224Ser) has been found repeatedly in azoospermic men (
                    - link "Reference 12" [ref=f1e737] [cursor=pointer]:
                      - /url: "#"
                      - text: "12"
                    - text: ","
                    - link "Reference 41" [ref=f1e739] [cursor=pointer]:
                      - /url: "#"
                      - text: "41"
                    - text: ) but did not show a significant effect in either assay. These results are consistent with the variant being present relatively frequently in the general population (gnomAD PopMax 0.01251), including homozygous women and men. While we cannot exclude that any of these DMRT1 variants have a (minor) effect that may become relevant when combined with either a variant in DMRT1 or in another gene, the current data make these variants unlikely to be monogenic causes of male infertility.
                  - paragraph [ref=f1e740]:
                    - text: Searching for other causal variants revealed one likely pathogenic splice variant in SYCP2 (c.-46-1G>A) in M2180 in addition to the DMRT1 variant c.910G>A p.(Val304Met), which showed activities comparable with the WT in both luciferase assays and is, based on all available data, classified as likely benign. Thus, the SYCP2 variant is likely involved in causing azoospermia in this man but, the DMRT1 variant may play an additional role because the man’s testicular phenotype was more severe (with tubular atrophy/shadows) than expected from previous SYCP2-affected men (
                    - link "Reference 10" [ref=f1e742] [cursor=pointer]:
                      - /url: "#"
                      - text: "10"
                    - text: ","
                    - link "Reference 46" [ref=f1e744] [cursor=pointer]:
                      - /url: "#"
                      - text: "46"
                    - text: ). Further, we identified the SOX8 variant c.1018A>T p.(Thr340Ser) in M2207, who is also heterozygous for DMRT1 c.194C>T p.(Ala65Val). While the DMRT1 variant showed no effects in either luciferase assay, was also present in proven fathers, and is assessed as likely benign, the SOX8 variant is rated as a VUS and pending follow-up. These examples illustrate that it is necessary to evaluate the full spectrum of genetic variation to assess single gene variants. In spermatogonia, DMRT1 inhibits STRA8 expression in vivo, which is in contrast to the activity of the WT DMRT1 observed in this study. However, it is known that DMRT1 transcriptional activity not only largely depends on the respective target gene but also on the individual cell type because of different cofactors (
                    - link "Reference 35" [ref=f1e746] [cursor=pointer]:
                      - /url: "#"
                      - text: "35"
                    - text: ","
                    - link "Reference 42" [ref=f1e748] [cursor=pointer]:
                      - /url: "#"
                      - text: "42"
                    - text: ). However, this phenomenon remains to be investigated and should be the focus of future studies.
                - generic [ref=f1e749]:
                  - heading "Conclusion" [level=2] [ref=f1e750]
                  - paragraph [ref=f1e751]: Despite the complexity of DMRT1’s function and the abovementioned limitations, assaying 13 DMRT1 missense variants allowed us to corroborate the pathogenicity of 2 DSD-associated variants (p.(Arg80Ser) and p.(Arg111Gly)) and 1 variant associated with isolated male infertility (p.(Met115Lys)). The effects seen for these variants demonstrate the validity of the assays, the requirement for researchers to analyze >1 target promoter, and the use of in vitro functional follow-up of variants, especially if they are primarily of uncertain significance. Application of these assays in clinical diagnostics will be of importance, especially when familial segregation data are missing. A significant effect on luciferase activity warrants a reclassification of variants from uncertain significance to (likely) pathogenic and therefore provides a definitive cause for male infertility. Taken together, the newly developed assays will be useful for both further delineating the molecular role of DMRT1 and variants therein as well as the clinical classification of variants to provide an accurate causal diagnosis.
