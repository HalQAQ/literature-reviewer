                            - paragraph [ref=f1e651]: Classification of DMRT1 variants before and after the luciferase assays.
                          - paragraph [ref=f1e653]:
                            - text: The classification was done according to the ACMG-AMP guidelines. Classifications altered after luciferase assays are marked in bold. Fulfilled classification criteria are listed in detail in
                            - link "Supplemental Table 2" [ref=f1e654] [cursor=pointer]:
                              - /url: "#supplementary-material"
                            - text: . ∗ indicates DSD variants. VUS = Variant of uncertain significance.
                          - list [ref=f1e656]:
                            - listitem [ref=f1e657]:
                              - link "Open table in a new tab" [ref=f1e658] [cursor=pointer]:
                                - /url: /action/showFullTableHTML?isHtml=true&tableId=tbl2&pii=S0015-0282%2822%2901982-3
                      - paragraph [ref=f1e659]:
                        - text: In the assay with the CYP19A1 promoter (
                        - link "Fig. 1" [ref=f1e660] [cursor=pointer]:
                          - /url: "#fig1"
                        - text: B), DMRT1 WT showed an inhibitory effect on luciferase activity when compared with the empty vector control (EV, pcDNA3.1(+) without insert; P=.0014). To validate our assay, we assessed the previously published variant c.240G>C p.(Arg80Ser) (
                        - link "Reference 39" [ref=f1e662] [cursor=pointer]:
                          - /url: "#"
                          - text: "39"
                        - text: ), located in the DMRT1 DM domain; this variant exhibited a loss-of-function effect (P=.0076) indicated by less strongly repressed luciferase activity than for the DMRT1 WT protein. Notably, this variant was found in a phenotypic female with XY-DSD. The second positive control was c.331A>G p.(Arg111Gly), a variant also located in the DM domain and found de novo in another XY-DSD patient (
                        - link "Reference 20" [ref=f1e664] [cursor=pointer]:
                          - /url: "#"
                          - text: "20"
                        - text: ). This variant did not show a significant effect on DMRT1 activity in this assay. Concerning the DMRT1 variants identified in the MERGE cohort, the de novo variant p.(Met115Lys) illustrated complete loss of function for transcriptional repression of the CYP19A1 promoter, indicated by a luciferase activity similar to that of the EV control and significantly different from WT DMRT1 (P=.0271). In contrast, the 2 variants p.(Lys103Arg) and p.(Asp331His) differed significantly from the WT (P=.0477 and.0442, respectively), showing a slight gain of function of 15% and 19%, respectively. All other missense variants displayed a repressive effect on this promoter, similar to the WT protein.
                      - paragraph [ref=f1e665]:
                        - text: The assay using the Stra8 promoter is complementary because the WT DMRT1 showed an activating effect (
                        - link "Fig. 1" [ref=f1e666] [cursor=pointer]:
                          - /url: "#fig1"
                        - text: C) on this promoter instead of the inhibitory effect of WT DMRT1 seen on the CYP19A1 promoter. In contrast to the CYP19A1 assay, the DSD variant p.(Arg80Ser) exhibited a significant gain of function for the Stra8 promoter, with a stimulating activity on the promoter that was twice as high as that for the WT (P=.0044). Furthermore, the DSD variant p.(Arg111Gly) showed a highly significant loss of function (P=.0003). The de novo variant p.(Met115Lys) from the MERGE cohort showed a pronounced loss of function, resembling the EV control luminescence values compared with the WT (P=.0002), similar to the CYP19A1 luciferase assay. All remaining missense variants demonstrated no aberrant transcriptional activity.
                    - generic [ref=f1e667]:
                      - heading "Functional analyses allow refining the clinical classifications of 3 DMRT1 variants" [level=4] [ref=f1e668]
                      - paragraph [ref=f1e669]:
                        - text: To report diagnostically relevant genetic findings, the American College of Medical Genetics and Genomics and the Association for Molecular Pathology (ACMG-AMP) recommend assessing variants for allelic, predictive, population, familial as well as functional data (
                        - link "Reference 40" [ref=f1e671] [cursor=pointer]:
                          - /url: "#"
                          - text: "40"
                        - text: ). Without taking functional data into account, 4 variants were rated likely benign, 7 as VUS, and 2 as likely pathogenic (adapted as recently applied in a previous study (
                        - link "Reference 10" [ref=f1e673] [cursor=pointer]:
                          - /url: "#"
                          - text: "10"
                        - text: ),
                        - link "Table 2" [ref=f1e674] [cursor=pointer]:
                          - /url: "#tbl2"
                        - text: ). Considering the luciferase assay results, we were able to refine and improve the ACMG classification in 3 cases (
                        - link "Table 2" [ref=f1e675] [cursor=pointer]:
                          - /url: "#tbl2"
                        - text: and
                        - link "Fig. 1" [ref=f1e676] [cursor=pointer]:
                          - /url: "#fig1"
                        - text: ", detailed in"
                        - link "Supplemental Table 2" [ref=f1e677] [cursor=pointer]:
                          - /url: "#supplementary-material"
                        - text: ).
                      - generic [ref=f1e678]:
                        - heading "3D modeling of loss-of-function variant p.(Met115Lys) located in the DM domain" [level=5] [ref=f1e679]
                        - paragraph [ref=f1e680]:
                          - text: Using homology modeling on the DMRT1 DM domain (PDB ID
                          - link "4YJ0" [ref=f1e681] [cursor=pointer]:
                            - /url: https://www.rcsb.org/structure/4YJ0
                          - text: ; (
                          - link "Reference 20" [ref=f1e683] [cursor=pointer]:
                            - /url: "#"
                            - text: "20"
                          - text: )), we examined the location of the variant p.(Met115Lys) in the 3-dimensional protein structure and its potential interactions with other amino acids. Based on this model (
                          - link "Fig. 2" [ref=f1e684] [cursor=pointer]:
                            - /url: "#fig2"
                          - text: ), the exchange of the highly conserved amino acid Met115 alters the specific hydrogen bond interactions with adjacent bases in this DNA-binding consensus site, supporting the notion that this amino acid is essential for appropriate protein function, and its exchange might impair DMRT1’s function.
                        - figure [ref=f1e686]:
                          - link " Figure 2 3D modeling of DMRT1’s DM domain bound to a DNA strand. Depiction of DMRT1’s DM domain as it coils around a target DNA strand and magnification highlighting how the methionine at position 115 engages in hydrogen bonds with neighboring amino acid residues in the major groove DNA recognition helix. This methionine is changed by the de novo variant c.344T>A p.(Met115Lys). Visualizations are based on the crystal structure of the human DMRT1 DM domain region, PDB ID 4YJ0 ( Reference 20 )." [ref=f1e687] [cursor=pointer]:
