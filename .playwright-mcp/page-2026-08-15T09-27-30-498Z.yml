                - paragraph [ref=e426]:
                  - text: The
                  - code [ref=e427]: cache/
                  - text: folder holds
                  - strong [ref=e428]: temporary files
                  - text: "generated while working: fetched full texts ("
                  - code [ref=e429]: <pmid>.txt
                  - text: ","
                  - code [ref=e430]: <pmid>_<source>.txt
                  - text: ) and intermediate search results. They are git-ignored and safe to delete.
                - paragraph [ref=e431]:
                  - text: "Why it exists: before fetching a paper, the agent checks"
                  - code [ref=e432]: cache/
                  - text: first and reuses an existing full-text file if present. This
                  - strong [ref=e433]: speeds up reading papers you have already covered
                  - text: by skipping the network fetch (and the HKU EZproxy round-trip for paywalled articles).
                - paragraph [ref=e434]:
                  - text: Feel free to
                  - strong [ref=e435]:
                    - text: clean
                    - code [ref=e436]: cache/
                    - text: whenever you want
                  - text: (e.g.
                  - code [ref=e437]: Remove-Item cache\*
                  - text: ) — nothing important lives there. Files will be re-fetched on demand. Note that reports are kept separately in
                  - code [ref=e438]: reports/
                  - text: and are not affected by clearing the cache.
