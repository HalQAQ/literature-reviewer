                  - heading "Usage" [level=2] [ref=e333]
                  - 'link "Permalink: Usage" [ref=e334] [cursor=pointer]':
                    - /url: "#usage"
                - paragraph [ref=e337]:
                  - text: Ask OpenCode to search literature on a topic. The
                  - code [ref=e338]: literature-review
                  - text: "skill handles the workflow:"
                - list [ref=e339]:
                  - listitem [ref=e340]:
                    - strong [ref=e341]: Mode 1 (screening)
                    - text: ":"
                    - code [ref=e342]: python scripts/mode1_search.py "query||synonyms" --limit 30
                  - listitem [ref=e343]:
                    - strong [ref=e344]: Mode 2 (full-text)
                    - text: ":"
                    - code [ref=e345]: python scripts/mode2_full_text.py --pmid <id>
                  - listitem [ref=e346]:
                    - strong [ref=e347]: RAG extraction
                    - text: ":"
                    - code [ref=e348]: python scripts/snippets.py "<question>" cache/<file>.txt --top 5
                  - listitem [ref=e349]:
                    - strong [ref=e350]: Mode 3 (single-paper deep reading)
                    - text: ":"
                    - code [ref=e351]: python scripts/mode3_deep_read.py "<pmid|doi|title>"
                    - text: or
                    - code [ref=e352]: python scripts/mode3_deep_read.py --local "<path>"
                - paragraph [ref=e353]:
                  - text: Reports are saved to
                  - code [ref=e354]: reports/
                  - text: in Markdown format. Deep-reading reports use the filename
                  - code [ref=e355]: <First Author> et al. - <Journal> - <Year>.md
                  - text: (e.g.
                  - code [ref=e356]: Zhang et al. - PLoS genetics - 2016.md
                  - text: ).
                - generic [ref=e357]:
                  - heading "Standard workflow" [level=2] [ref=e358]
                  - 'link "Permalink: Standard workflow" [ref=e359] [cursor=pointer]':
                    - /url: "#standard-workflow"
                - paragraph [ref=e362]: "The tool can be used through OpenCode or any AI-agent tool. All prompts to the user are in English. Every new search/deep-read task follows this flow:"
                - list [ref=e363]:
                  - listitem [ref=e364]:
                    - strong [ref=e365]: Start
                    - text: "— two ways:"
                    - list [ref=e366]:
                      - listitem [ref=e367]:
                        - emphasis [ref=e368]: Entry A
                        - text: ": you say something like \"start using literature reviewer\" or \"start a literature search\" (no specific request yet) → the agent introduces the modes below."
                      - listitem [ref=e369]:
                        - emphasis [ref=e370]: Entry B
                        - text: ": you directly give keywords plus an explicit request, e.g. \"search articles about the BMP pathway\" or \"deep read PMID 27583450\" → step 2 is skipped."
                  - listitem [ref=e371]:
                    - strong [ref=e372]: Choose a mode
                    - text: "(only for Entry A): 1) Title + Abstract Quick Search — describe the search direction; 2) Full-Text Detailed Report — describe the search direction; 3) Single-Paper Deep Reading — provide the article's DOI/PMID/title or the local file path."
                  - listitem [ref=e373]:
                    - strong [ref=e374]: Confirm the plan
                    - text: — the agent restates what it will do (e.g. "Shall I run a quick search using keywords 'XX', 'YY'?") and waits for your final confirmation; you may amend details.
                  - listitem [ref=e375]:
                    - strong [ref=e376]: Report location
                    - text: "— the agent asks where to save the report: default"
                    - code [ref=e377]: <workspace>\reports\
                    - text: ", or a custom target path (report is then saved to"
                    - code [ref=e378]: <target>\paper_reports\
                    - text: ).
                  - listitem [ref=e379]:
                    - strong [ref=e380]: Execute
                    - text: — the search/deep-reading is performed and the report is generated and saved.
                  - listitem [ref=e381]:
                    - strong [ref=e382]: Completion summary
                    - text: "— the agent reports (in English): number of articles found, how many were deemed useful after screening, how many references the report cites, search duration (the scripts print"
                    - code [ref=e383]: "ELAPSED: N.Ns"
                    - text: ), and the full path where the report was saved.
                - paragraph [ref=e384]: Follow-up questions about an already-generated report do not restart this flow.
                - generic [ref=e385]:
                  - heading "Report location" [level=2] [ref=e386]
                  - 'link "Permalink: Report location" [ref=e387] [cursor=pointer]':
                    - /url: "#report-location"
                - list [ref=e390]:
                  - listitem [ref=e391]:
                    - text: By default, reports are saved to
                    - code [ref=e392]: reports/
                    - text: in this workspace.
                  - listitem [ref=e393]:
                    - text: If you ask for reports to be written
                    - strong [ref=e394]: elsewhere
                    - text: (e.g. inside another project you are working on), they are saved to
                    - code [ref=e395]: <target-path>/paper_reports/
                    - text: . The
                    - code [ref=e396]: paper_reports
                    - text: subfolder is created automatically if it does not exist.
                - generic [ref=e397]:
                  - 'heading "Mode 3: Single-paper deep reading" [level=2] [ref=e398]'
                  - 'link "Permalink: Mode 3: Single-paper deep reading" [ref=e399] [cursor=pointer]':
                    - /url: "#mode-3-single-paper-deep-reading"
                - paragraph [ref=e402]: Given a single paper (by PMID, DOI, title, or a local PDF/text file), the agent fetches/reads its full text, deep-reads it, and writes a structured report that answers any questions the user asked. After the report is generated you can keep asking questions about the same paper; answers are appended to the report only when you explicitly ask.
