                    - text: ). However, conditional deletion of
                    - emphasis [ref=e666]: Dmrt1
                    - text: in embryonic germ cells had earlier effects, disrupting mitotic reactivation, migration and postnatal viability and demonstrating that DMRT1 also is autonomously required in germ cells (
                    - link "Kim et al., 2007a" [ref=e667] [cursor=pointer]:
                      - /url: "#bb0075"
                    - text: ).
