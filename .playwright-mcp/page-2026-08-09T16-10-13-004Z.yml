                  - link "Yoshida et al., 2006" [ref=e534] [cursor=pointer]:
                    - /url: "#bb0265"
                  - text: ). During steady-state spermatogenesis, SSCs supply a population of undifferentiated spermatogonia, which divide by incomplete cytokinesis to form chains of cells termed A
                  - subscript [ref=e536]: aligned
                  - text: (A
                  - subscript [ref=e537]: al
                  - text: ) spermatogonia, ranging from two to sixteen cells. A
                  - subscript [ref=e538]: al
                  - text: cells enter differentiation in waves along the length of the seminiferous tubule in response to RA signaling. Differentiating spermatogonia then undergo a species-specific number of mitotic divisions (6 in the mouse) that are accompanied by differentiation through distinct cell types, progressing from A1 through B spermatogonia, before forming preleptotene spermatocytes and entering meiosis, again in response to RA signaling (
                  - link "de Rooij and Russell, 2000" [ref=e539] [cursor=pointer]:
