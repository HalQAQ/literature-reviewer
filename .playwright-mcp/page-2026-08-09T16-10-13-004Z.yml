                    - paragraph [ref=e520]:
                      - text: Fig. 1. Overview of spermatogenesis and DMRT protein expression. PGCs (yellow) are specified around E6.25 through BMP and WNT signaling through the extraembryonic ectoderm (pink) and proximal epiblast (brown), respectively. PGCs migrate, arriving at the genital ridge around E10.5. After sex determination (~ E12.5), female germ cells advance to meiotic prophase, followed by meiotic arrest until after birth, when oogenesis is re-initiated. In males, germ cells (prospermatogonia; proSGs) undergo mitotic arrest until after birth. Spermatogenesis initiates perinatally and is supported by SSCs, which divide by incomplete cytokinesis to form A
                      - subscript [ref=e521]: al
                      - text: spermatogonia, ranging from two to sixteen cells before differentiating into A1 spermatogonia (SSCs and A
                      - subscript [ref=e522]: al
                      - text: are collectively called undifferentiated spermatogonia). A
                      - subscript [ref=e523]: al
                      - text: spermatogonia have the ability to replenish SSCs (width of arrows indicates relative probability of replenishment by each cell type). A1 spermatogonia undergo five rounds of mitotic divisions and differentiation to produce A2, A3, A4, Intermediate and type B spermatogonia (collectively called differentiating spermatogonia), before forming preleptotene spermatocytes and entering meiosis to produce primary and secondary spermatocytes, followed by differentiation into spermatids. During postnatal spermatogenesis, DMRT1 (red) is expressed in all mitotic germ cells, DMRT6 (blue) is expressed in A4, Intermediate and type B spermatogonia, and DMRT7 (green) is expressed in late primary spermatocytes.
                - generic [ref=e524]:
                  - generic [ref=e525]:
                    - generic [ref=e526]:
                      - text: At birth the male germ line reawakens, reentering the mitotic cell cycle, migrating from the center to the periphery of the developing
                      - link "seminiferous tubules" [ref=e527] [cursor=pointer]:
                        - /url: /topics/biochemistry-genetics-and-molecular-biology/seminiferous-tubule
                      - generic [ref=e528]:
                        - text: ", and beginning to differentiate from proSGs into spermatogonia. During the first postnatal week a subset of proSGs transition into c-KIT-positive differentiating spermatogonia under the influence of"
                        - link "retinoic acid" [ref=e529] [cursor=pointer]:
                          - /url: /topics/biochemistry-genetics-and-molecular-biology/tretinoin
                        - text: (RA), initiating a “first wave” of spermatogenesis, while others become established as spermatogonial stem cells (SSCs) that supply undifferentiated spermatogonia to support subsequent spermatogenesis. Lineage tracing experiments have revealed a clear
                    - link "genetic" [ref=e530] [cursor=pointer]:
