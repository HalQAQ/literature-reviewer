                          - 'link "Download: Download high-res image (305KB)" [ref=e985] [cursor=pointer]':
                            - /url: https://ars-els-cdn-com.eproxy.lib.hku.hk/content/image/1-s2.0-S1873506117301502-gr6_lrg.jpg
                        - listitem [ref=e988]:
                          - 'link "Download: Download full-size image" [ref=e989] [cursor=pointer]':
                            - /url: https://ars-els-cdn-com.eproxy.lib.hku.hk/content/image/1-s2.0-S1873506117301502-gr6.jpg
                    - paragraph [ref=e994]:
                      - text: "Fig. 6. DMRT7 and the meiotic to postmeiotic sex chromatin transition. (A) DMRT7 is localized to the sex-bodies of pachytene and diplotene spermatocytes (green). It is not required for MSCI modifications, but it is required for PMSC modifications: H3K9me2 and H3K9me3 marks and HP1β (orange). (B) In"
                      - emphasis [ref=e995]: Dmrt7
                      - text: mutants, PMSC modifications are absent in late meiotic cells, resulting in apoptosis.
              - generic [ref=e996]:
                - heading "7. How do DMRT proteins do the voodoo that they do so well?" [level=2] [ref=e997]
                - generic [ref=e998]:
                  - generic [ref=e999]:
                    - text: Given the diversity of functions performed by DMRT proteins during gametogenesis, an important question is how they recognize their DNA target sites and
                    - link "control gene expression" [ref=e1000] [cursor=pointer]:
                      - /url: /topics/biochemistry-genetics-and-molecular-biology/gene-expression-control
                    - generic [ref=e1001]:
                      - text: . For example, it is unclear mechanistically how DMRT1 promotes efficient
                      - link "mitotic arrest" [ref=e1002] [cursor=pointer]:
                        - /url: /topics/biochemistry-genetics-and-molecular-biology/mitosis-inhibition
                      - text: and suppression of pluripotency in embryonic germ cells yet activates mitosis in perinatal germ cells (
                  - link "Fahrioglu et al., 2007" [ref=e1003] [cursor=pointer]:
                    - /url: "#bb0030"
                  - text: ","
                  - link "Krentz et al., 2009" [ref=e1005] [cursor=pointer]:
                    - /url: "#bb0095"
                  - text: ), how it helps maintain SSCs yet promotes differentiation and proliferation of spermatogonia (
                  - link "Matson et al., 2010" [ref=e1007] [cursor=pointer]:
                    - /url: "#bb0130"
                  - text: ","
                  - link "Zhang et al., 2016" [ref=e1009] [cursor=pointer]:
                    - /url: "#bb0285"
                  - text: ), or how it represses
                  - emphasis [ref=e1011]: Stra8
                  - text: in spermatogonia yet activates
                  - emphasis [ref=e1012]: Stra8
                  - generic [ref=e1013]:
                    - text: in
                    - link "oogonia" [ref=e1014] [cursor=pointer]:
                      - /url: /topics/biochemistry-genetics-and-molecular-biology/oogonium
                    - text: (
                  - link "Krentz et al., 2011" [ref=e1015] [cursor=pointer]:
                    - /url: "#bb0100"
                  - text: ","
                  - link "Matson et al., 2010" [ref=e1017] [cursor=pointer]:
                    - /url: "#bb0130"
                  - text: ). Based on its ability to trigger cell fate reprogramming of differentiated granulosa cells, DMRT1 is a likely candidate to act as a pioneer factor, opening closed chromatin domains for other transcriptional regulators (
                  - link "Lindeman et al., 2015" [ref=e1019] [cursor=pointer]:
                    - /url: "#bb0120"
                  - generic [ref=e1021]:
                    - text: ). Almost certainly, interaction with partner proteins that have more specialized functions and more restricted expression helps DMRT1 (and presumably other DMRT proteins) to perform context-specific regulatory functions, but these partners have not yet been identified.
                    - link "SOX9" [ref=e1022] [cursor=pointer]:
                      - /url: /topics/biochemistry-genetics-and-molecular-biology/sox9
                    - text: is a prime candidate to act with DMRT1 in its somatic roles (
                  - link "Minkina et al., 2014" [ref=e1023] [cursor=pointer]:
                    - /url: "#bb0150"
                  - text: ), but potential germ line partners are less obvious.
                - generic [ref=e1025]:
                  - generic [ref=e1026]:
                    - generic [ref=e1027]:
                      - text: Does DNA binding specificity of DMRT proteins also contribute to their functional diversity? The DM domain DNA binding motif is by far the most highly conserved motif in DMRT proteins and in vitro DNA site selection found that DMRT proteins prefer very similar
                      - link "DNA sequences" [ref=e1028] [cursor=pointer]:
                        - /url: /topics/biochemistry-genetics-and-molecular-biology/dna-sequence
                      - text: ", binding to a palindromic or pseudopalindromic consensus sequence. Moreover,"
                    - link "in vivo studies" [ref=e1029] [cursor=pointer]:
                      - /url: /topics/biochemistry-genetics-and-molecular-biology/in-vivo-study
                    - text: "support the similarity in DNA binding properties: the fly Dsx"
                  - superscript [ref=e1030]: M
                  - text: protein can partially substitute for the nematode MAB-3 protein (
                  - link "Raymond et al., 1998" [ref=e1031] [cursor=pointer]:
                    - /url: "#bb0185"
                  - text: ) in
                  - emphasis [ref=e1034]:
                    - link "C. elegans" [ref=e1035] [cursor=pointer]:
                      - /url: /topics/biochemistry-genetics-and-molecular-biology/caenorhabditis-elegans
                  - text: ", and ChIP-seq analysis found that DMRT1 and DMRT6 associate with many of the same DNA sites in the mouse testis ("
                  - link "Zhang et al., 2014" [ref=e1036] [cursor=pointer]:
                    - /url: "#bb0280"
                  - text: ). These results suggest that DMRT proteins might bind rather generically to a shared DNA site.
                - generic [ref=e1038]:
                  - generic [ref=e1039]:
                    - generic [ref=e1040]:
                      - text: More recently, however, structural analysis has revealed unexpected diversity of DNA binding by DMRT1 and shown that some of its DNA interactions are highly unconventional.
                      - link "DNase" [ref=e1041] [cursor=pointer]:
                        - /url: /topics/biochemistry-genetics-and-molecular-biology/deoxyribonuclease
                      - generic [ref=e1042]:
                        - text: I footprinting and
                        - link "gel mobility shift assays" [ref=e1043] [cursor=pointer]:
                          - /url: /topics/biochemistry-genetics-and-molecular-biology/electrophoretic-mobility-shift-assay
                        - generic [ref=e1044]:
                          - text: ", combined with X-ray crystallography, found that DMRT1 can form dimers, trimers or tetramers with DNA, and high resolution ChIP (ChIP-exo) suggested that these"
                          - link "stoichiometries" [ref=e1045] [cursor=pointer]:
                            - /url: /topics/biochemistry-genetics-and-molecular-biology/stoichiometry
                          - text: also form in vivo (
                    - link "Fig. 7" [ref=e1046] [cursor=pointer]:
                      - /url: "#f0035"
                    - text: ) (
                    - link "Murphy et al., 2015" [ref=e1048] [cursor=pointer]:
                      - /url: "#bb0160"
                    - generic [ref=e1050]:
                      - text: ). The different stoichiometries involve surprisingly different modes of protein/DNA interaction in which the same key DM domain
                      - link "amino acid" [ref=e1051] [cursor=pointer]:
                        - /url: /topics/biochemistry-genetics-and-molecular-biology/amino-acids
                      - generic [ref=e1052]:
                        - generic [ref=e1053]:
                          - text: sidechains are deployed differently to mediate DNA interaction. Unexpectedly, DNA binding using all three stoichiometries involves insertion of antiparallel
                          - link "alpha helices" [ref=e1054] [cursor=pointer]:
                            - /url: /topics/biochemistry-genetics-and-molecular-biology/alpha-helix
                          - text: from two different DMRT1
                        - link "protomers" [ref=e1055] [cursor=pointer]:
                          - /url: /topics/biochemistry-genetics-and-molecular-biology/protomer
                        - generic [ref=e1056]:
                          - text: into a widened DNA major groove. The same DM domain protein sidechains make crucial DNA contacts in dimers and higher order complexes, but their arrangement and the arrangement of the DM domain overall is quite different. These quite different arrangements may present opportunities for stoichiometry-dependent interactions between DMRT proteins and other regulators. Insertion of two alpha helices into the same region of the DNA major groove is not a standard DNA recognition strategy; indeed it has never been observed for any other
                          - link "DNA binding protein" [ref=e1057] [cursor=pointer]:
                            - /url: /topics/biochemistry-genetics-and-molecular-biology/dna-binding-protein
                          - text: .
                  - figure [ref=e1058]:
                    - generic [ref=e1059]:
                      - img "Fig. 7" [ref=e1060]
                      - list [ref=e1061]:
                        - listitem [ref=e1062]:
                          - 'link "Download: Download high-res image (272KB)" [ref=e1063] [cursor=pointer]':
                            - /url: https://ars-els-cdn-com.eproxy.lib.hku.hk/content/image/1-s2.0-S1873506117301502-gr7_lrg.jpg
                        - listitem [ref=e1066]:
                          - 'link "Download: Download full-size image" [ref=e1067] [cursor=pointer]':
                            - /url: https://ars-els-cdn-com.eproxy.lib.hku.hk/content/image/1-s2.0-S1873506117301502-gr7.jpg
                    - paragraph [ref=e1072]: Fig. 7. Multiple stoichiometries of DM domain DNA binding. DM domain can bind DNA in three stoichiometries. Trimer structure was determined by X-ray crystallography. Dimer and tetramer are molecular models based on the X-ray structure and supported by in vitro gel mobility shift and DNaseI protection assays and in vivo ChiP-exo analysis.
                - generic [ref=e1073]:
                  - text: What is the functional significance of having multiple DM domain DNA recognition modes? This question is important but still unresolved. ChIP-exo indicates that different genomic sites bind different DMRT1 stoichiometries, and which sites bind which stoichiometry can be predicted based on the primary sequence and predicted groove widths of the DNA segment. This suggests that for DMRT1, like other DNA binding proteins, DNA recognition involves a combination of sequence and shape recognition (
                  - link "Slattery et al., 2014" [ref=e1074] [cursor=pointer]:
                    - /url: "#bb0220"
                  - text: ). However, it is not yet established whether binding by DMRT1 in a particular stoichiometry has a specific outcome, for example binding in one stoichiometry allowing co-binding with a specific regulatory protein partner, or one stoichiometry triggering transcriptional repression while another leads to activation.
                - generic [ref=e1076]:
                  - generic [ref=e1077]:
                    - link "Human genetics" [ref=e1078] [cursor=pointer]:
                      - /url: /topics/biochemistry-genetics-and-molecular-biology/human-genetics
                    - text: suggests that DMRT1 binding stoichiometry may be important (
                  - link "Murphy et al., 2015" [ref=e1079] [cursor=pointer]:
                    - /url: "#bb0160"
                  - generic [ref=e1081]:
                    - generic [ref=e1082]:
                      - text: ). The evidence comes from an XY female heterozygous for a
                      - link "point mutation" [ref=e1083] [cursor=pointer]:
                        - /url: /topics/biochemistry-genetics-and-molecular-biology/point-mutation
                      - text: in a key DNA recognition residue, Arg111Gly. The severity of the phenotype, which is equivalent to a null mutation in SRY or SOX9, suggests that the
                    - link "mutant protein" [ref=e1084] [cursor=pointer]:
                      - /url: /topics/biochemistry-genetics-and-molecular-biology/mutant-protein
                    - text: might interfere with function of the wild type allele. Indeed, in vitro the mutant protein binds DNA poorly, as expected, but when mixed with wild type DMRT1 causes it to bind in a tetramer to sites that normally would bind a trimer. Assuming that stoichiometry of DMRT1 binding is important for function, the disruption of stoichiometry caused by the Arg111Gly mutation is likely to underlie much of the phenotype. To better understand the consequences of this mutation it will be important to combine structural analysis of the wild type/mutant DMRT1 complex on DNA with in vivo modeling of the heterozygous mutation in the mouse.
              - generic [ref=e1085]:
                - heading "8. Summary and prospects" [level=2] [ref=e1086]
                - generic [ref=e1087]:
                  - generic [ref=e1088]:
                    - text: DMRT genes have likely regulated
                    - link "metazoan" [ref=e1089] [cursor=pointer]:
                      - /url: /topics/biochemistry-genetics-and-molecular-biology/animal
                    - text: sexual development since early in metazoan evolution (
                  - link "Kopp, 2012" [ref=e1090] [cursor=pointer]:
                    - /url: "#bb0085"
                  - text: ","
                  - link "Matson and Zarkower, 2012" [ref=e1092] [cursor=pointer]:
                    - /url: "#bb0125"
                  - text: ). This ancient involvement in reproduction has allowed the elaboration of their functions, as can be glimpsed in studies of
                  - emphasis [ref=e1094]: Dmrt
                  - generic [ref=e1095]:
                    - text: gene regulation of spermatogenesis. DMRT1, 6 and 7 guide male germ cells through a significant portion of their development. In doing so they contribute to a robust cellular system that can support the sustained production of remarkable quantities of gametes over periods of years to decades and can recover from severe disruptions. Now that the biology controlled by this
                    - link "gene family" [ref=e1096] [cursor=pointer]:
                      - /url: /topics/biochemistry-genetics-and-molecular-biology/multigene-family
                    - text: in the mammalian testis is relatively well mapped out, a primary challenge will be to understand the detailed molecular mechanisms by which DMRT proteins impose diverse regulatory outcomes on their target genes. Fortunately the timely advent of new genomic tools and techniques should ensure and accelerate further progress on this important question.
