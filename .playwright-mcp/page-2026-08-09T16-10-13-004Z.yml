                    - emphasis [ref=e746]: Dmrt1
                    - text: in embryonic germ cells causes their perinatal arrest and death (
                    - link "Fahrioglu et al., 2007" [ref=e747] [cursor=pointer]:
                      - /url: "#bb0030"
                    - generic [ref=e749]:
                      - text: ). Thus the arrested
                      - link "mutant cells" [ref=e750] [cursor=pointer]:
                        - /url: /topics/biochemistry-genetics-and-molecular-biology/cell-mutant
                      - text: are similar to embryonic proSGs (
                    - link "McCarrey, 2013" [ref=e751] [cursor=pointer]:
                      - /url: "#bb0140"
                    - text: ). This phenotype is similar in some respects to that of
                    - emphasis [ref=e753]: Rhox10
                    - text: mutants, which also have defects in early postnatal germ cell migration and establishment of SSCs (
                    - link "Song et al., 2016" [ref=e754] [cursor=pointer]:
                      - /url: "#bb0225"
                    - text: ). However the perinatal arrest phenotype is more severe in
                    - emphasis [ref=e756]: Dmrt1
                    - text: mutants, suggesting either that
                    - emphasis [ref=e757]: Rhox10
                    - text: acts downstream of
                    - emphasis [ref=e758]: Dmrt1
                    - text: or that the two genes act at least partially in parallel.
                  - generic [ref=e759]:
                    - generic [ref=e760]:
                      - text: DMRT1 continues to be expressed postnatally in all spermatogonia from undifferentiated A
                      - subscript [ref=e761]: s
                      - text: cells through to differentiated B spermatogonia, and conditional genetics has shown that it continues to function in SSCs after they form (
                      - link "Fig. 3" [ref=e762] [cursor=pointer]:
                        - /url: "#f0015"
                      - text: ). Deletion of
                      - emphasis [ref=e764]: Dmrt1
                      - text: in putative SSCs using
                      - emphasis [ref=e765]: Oct4-CreERT2
                      - text: caused a progressive loss of SSCs (
                      - link "Zhang et al., 2016" [ref=e766] [cursor=pointer]:
                        - /url: "#bb0285"
                      - text: ) (
                      - link "Fig. 3" [ref=e768] [cursor=pointer]:
                        - /url: "#f0015"
                      - text: A,B). Deletion of
                      - emphasis [ref=e770]: Dmrt1
                      - text: in SSCs was associated with reduced expression of the SSC maintenance factor PLZF, whose loss can cause a similar progressive failure of spermatogenesis (
                      - link "Buaas et al., 2004" [ref=e771] [cursor=pointer]:
                        - /url: "#bb0010"
                      - text: ","
                      - link "Costoya et al., 2004" [ref=e773] [cursor=pointer]:
                        - /url: "#bb0015"
                      - text: ). DMRT1 binds to a site upstream of
                      - emphasis [ref=e775]: Plzf
                      - text: in spermatogonia, and a DMRT1 half-site was found under the peak, suggesting that DMRT1 may directly control SSC maintenance in part through transcriptional control of
                      - emphasis [ref=e776]: Plzf
                      - text: ", acting in concert with a partner regulator. SSC-specific expression of such a partner could help explain why DMRT1 activates"
                      - emphasis [ref=e777]: Plzf
                      - text: in SSCs but not in differentiating spermatogonia. In vivo, SSC depletion in
                      - emphasis [ref=e778]: Dmrt1
                      - text: conditional mutants appears to result from differentiation rather than cell death, as no elevation in apoptosis was apparent and lineage tracing allowed mutant germ cells to be followed into spermatogonial differentiation (
                      - link "Zhang et al., 2016" [ref=e779] [cursor=pointer]:
                        - /url: "#bb0285"
                      - text: ). By contrast, in vitro depletion of
                      - emphasis [ref=e781]: Dmrt1
                      - text: in cultured germ line stem cells (GS cells) caused elevated
                      - emphasis [ref=e782]: Sox2
                      - text: expression and apoptosis (
                      - link "Takashima et al., 2013" [ref=e783] [cursor=pointer]:
                        - /url: "#bb0250"
                      - text: ). This difference in phenotype may be explained by differences in the specific cell types studied, microenvironment differences, or both. The similarity of the in vitro GS cell phenotype to the in vivo effects of embryonic
                      - emphasis [ref=e785]: Dmrt1
                      - text: deletion suggests the possibility that GS cells might represent an earlier or more primitive germ cell developmental stage than Id4-GFP positive SSCs.
