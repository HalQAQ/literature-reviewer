                  - generic [ref=e806]:
                    - text: DMRT1 also plays a key role in replenishment of SSCs after depletion by cytotoxic stress. Lineage tracing experiments have shown that expression of
                    - emphasis [ref=e807]: Ngn3
                    - text: "normally marks a commitment step in spermatogonial development: pulse labeling with"
                    - emphasis [ref=e808]: Ngn3-cre
                    - text: marks differentiating germ cell types, but only transiently, indicating that
                    - emphasis [ref=e809]: Ngn3
                    - generic [ref=e810]:
                      - text: is expressed in committed
                      - link "progenitor cells" [ref=e811] [cursor=pointer]:
                        - /url: /topics/biochemistry-genetics-and-molecular-biology/progenitor-cell
                      - text: or transit amplifying cells that normally do not serve as stable SSCs (
                    - link "Nakagawa et al., 2007" [ref=e812] [cursor=pointer]:
                      - /url: "#bb0165"
                    - text: ). However,
                    - emphasis [ref=e814]: Ngn3
                    - generic [ref=e815]:
                      - text: "-positive cells can be induced to function as SSCs, either by transplantation to germ cell deficient testes or by chemical depletion of germ cells in situ using"
                      - link "busulfan" [ref=e816] [cursor=pointer]:
                        - /url: /topics/biochemistry-genetics-and-molecular-biology/busulfan
                      - text: (
                    - link "Nakagawa et al., 2007" [ref=e817] [cursor=pointer]:
                      - /url: "#bb0165"
                    - text: ","
                    - link "Nakagawa et al., 2010" [ref=e819] [cursor=pointer]:
                      - /url: "#bb0170"
                    - text: ). Thus
                    - emphasis [ref=e821]: Ngn3
                    - text: "-positive cells have been proposed to function as “potential stem cells” that can, under conditions of stress, serve as SSCs or give rise to SSCs; these cells are functionally distinct from the “actual stem cells” that normally maintain spermatogenesis during steady state ("
                    - link "Nakagawa et al., 2007" [ref=e822] [cursor=pointer]:
                      - /url: "#bb0165"
                    - text: ). Lineage-tracing experiments showed that deletion of
                    - emphasis [ref=e824]: Dmrt1
                    - text: in
                    - emphasis [ref=e825]: Ngn3
                    - text: "-Cre expressing spermatogonia blocked repopulation of ID4-positive SSCs after their depletion by busulfan treatment ("
                    - link "Zhang et al., 2016" [ref=e826] [cursor=pointer]:
                      - /url: "#bb0285"
                    - text: ) (
                    - link "Fig. 3" [ref=e828] [cursor=pointer]:
                      - /url: "#f0015"
                    - text: C, D).
                  - generic [ref=e830]:
                    - generic [ref=e831]:
                      - text: The cell of origin for SSC replenishment has not been positively identified and the path of
                      - link "SSC renewal" [ref=e832] [cursor=pointer]:
                        - /url: /topics/biochemistry-genetics-and-molecular-biology/cell-renewal
                      - text: has not been fully traced. Therefore several possible models can account for how Id4-GFP positive SSCs are replaced after germ cell depletion by cells that express
                    - emphasis [ref=e833]: Ngn3-Cre
                    - text: . The simplest model is that busulfan kills SSCs and this triggers a response by
                    - emphasis [ref=e834]: Ngn3
                    - generic [ref=e835]:
                      - text: "-positive spermatogonia, which activate their latent stem"
                      - link "cell potential" [ref=e836] [cursor=pointer]:
                        - /url: /topics/biochemistry-genetics-and-molecular-biology/cell-membrane-potential
                      - generic [ref=e837]:
                        - text: and reestablish the SSC pool, in a DMRT1-dependent process that may involve
                        - link "dedifferentiation" [ref=e838] [cursor=pointer]:
                          - /url: /topics/biochemistry-genetics-and-molecular-biology/cell-dedifferentiation
                        - text: (
                    - link "Fig. 3" [ref=e839] [cursor=pointer]:
                      - /url: "#f0015"
                    - text: C). An alternative that cannot currently be excluded is that SSCs are not killed by busulfan; instead they may turn off Id4-GFP and transiently activate
                    - emphasis [ref=e841]: Ngn3
                    - text: in response to germ cell depletion, before returning to an Id4-GFP positive state. Additionally it is possible that another cell type, perhaps a more primitive class of quiescent SSCs, resists busulfan and converts into Id4-GFP positive SSCs in response to stress, in a process involving transient
                    - emphasis [ref=e842]: Ngn3
                    - text: expression. Whatever the precise path of SSC replenishment, it is clear that DMRT1 is required for the regeneration of functional SSCs after busulfan exposure. Thus DMRT1 not only helps maintain SSCs under normal conditions but also helps regenerate them under stress conditions. Through these dual roles DMRT1 is important for maintaining SSC homeostasis in the mouse.
                - generic [ref=e843]:
                  - heading "4.4. DMRT1 and the mitosis/meiosis switch" [level=3] [ref=e844]
                  - generic [ref=e845]:
                    - generic [ref=e846]:
                      - text: During steady state spermatogenesis DMRT1 also plays a crucial role in differentiating spermatogonia. In contrast to SSCs, where it promotes self-renewal, in more advanced spermatogonia DMRT1 promotes differentiation and mitotic proliferation and prevents premature initiation of meiosis (
                      - link "Matson et al., 2010" [ref=e847] [cursor=pointer]:
                        - /url: "#bb0130"
                      - text: ). Deletion of
                      - emphasis [ref=e849]: Dmrt1
                      - text: in
                      - emphasis [ref=e850]: Ngn3
                      - text: "-positive undifferentiated spermatogonia during steady state (without busulfan treatment) appears to hyperactivate RA signaling and truncates the normal mitotic program ("
                      - link "Fig. 4" [ref=e851] [cursor=pointer]:
                        - /url: "#f0020"
                      - text: ). When
                      - emphasis [ref=e853]: Dmrt1
                      - text: is deleted with
                      - emphasis [ref=e854]: Ngn3-Cre
                      - text: ", cells morphologically resembling undifferentiated spermatogonia enter meiosis. These mutant germ cells can complete gametogenesis to form elongated spermatids, but the number of mutant cells forming spermatids is greatly reduced relative to wild type since the normal series of proliferative spermatogonial divisions is skipped or abbreviated. This phenotype indicates that DMRT1 normally serves to promote mitotic proliferation, to inhibit meiotic initiation, or both. Gene expression changes in"
                      - emphasis [ref=e855]: Dmrt1
                      - text: mutant cells and DMRT1 ChIP analysis suggest that DMRT1 does in fact promote the mitotic/differentiation program as well as inhibit the meiotic program. Mutant cells have reduced expression of proteins that promote spermatogonial differentiation, such as SOHLH1, and inappropriately high expression of the meiotic inducer STRA8, and DMRT1 ChIP analysis suggests that the genes encoding both proteins are transcriptionally regulated by DMRT1. In mammalian spermatogenesis, meiotic initiation requires RA, which activates meiotic inducers including
                      - emphasis [ref=e856]: Stra8
                      - text: . ChIP showed that DMRT1 binds the
                      - emphasis [ref=e857]: Stra8
                      - generic [ref=e858]:
                        - text: locus between two RA
                        - link "response elements" [ref=e859] [cursor=pointer]:
                          - /url: /topics/biochemistry-genetics-and-molecular-biology/response-element
                        - text: (RAREs). Transcriptional repression of
                      - emphasis [ref=e860]: Stra8
                      - text: by DMRT1 would be sufficient to explain its ability to block premature meiosis, but DMRT1 also appears to promote spermatogonial development by two additional mechanisms. First, as mentioned above DMRT1 activates expression of spermatogonial differentiation factors including
                      - emphasis [ref=e861]: Sohlh1
                      - generic [ref=e862]:
                        - text: and its
                        - link "paralog" [ref=e863] [cursor=pointer]:
                          - /url: /topics/biochemistry-genetics-and-molecular-biology/paralogy
                      - emphasis [ref=e864]: Sohlh2
                      - text: ", which promote the mitotic/differentiation program, and"
                      - emphasis [ref=e865]: Sohlh1
                      - text: is a candidate direct target of DMRT1 in spermatogonia. Second, DMRT1 not only represses the response of
                      - emphasis [ref=e866]: Stra8
                      - text: to RA signaling but also more generally inhibits RA signaling by regulating expression of genes involved in RA-dependent transcription including
                      - emphasis [ref=e867]: Crabp2
                      - text: ","
                      - emphasis [ref=e868]: Tbx1
                      - text: ", and"
                      - emphasis [ref=e869]: Cyp26a1
                      - generic [ref=e870]:
                        - text: ", and the RA synthetic"
                        - link "enzymes" [ref=e871] [cursor=pointer]:
                          - /url: /topics/biochemistry-genetics-and-molecular-biology/enzyme
                      - emphasis [ref=e872]: Adh4
                      - text: and
                      - emphasis [ref=e873]: Aldh1a1
                      - text: . Inappropriately high RA signaling can be detected in
                      - emphasis [ref=e874]: Dmrt1
                      - text: mutant spermatogonia using a
                      - emphasis [ref=e875]: RARE-lacZ
                      - text: reporter transgene. Moreover, vitamin A depletion (VAD) suppresses the precocious meiotic entry in
                      - emphasis [ref=e876]: Dmrt1
                      - text: mutant spermatogonia, confirming the RA-dependence of the phenotype. However,
                      - emphasis [ref=e877]: Dmrt1
                      - text: mutant spermatogonia in VAD mice appear to arrest closer to meiotic prophase than do wild type cells, suggesting that RA is not the only meiosis-promoting signal that normally is inhibited by DMRT1. Together these data suggest that DMRT1 transcriptionally regulates the mitosis/meiosis switch by promoting mitosis and differentiation while also inhibiting meiotic initiation (
                      - link "Matson et al., 2010" [ref=e878] [cursor=pointer]:
                        - /url: "#bb0130"
                      - text: ). Because DMRT1 expression is higher in undifferentiated spermatogonia than in differentiated spermatogonia, particularly type B spermatogonia, one possibility is that DMRT1 functions as a transcriptional rheostat to set levels of RA ligand and/or downstream response that are appropriate to the different stages of spermatogonial development. How DMRT1 is silenced in preleptotene spermatocytes to allow meiotic initiation is an important unresolved question.
                    - figure [ref=e880]:
                      - generic [ref=e881]:
                        - img "Fig. 4" [ref=e882]
                        - list [ref=e883]:
                          - listitem [ref=e884]:
                            - 'link "Download: Download high-res image (181KB)" [ref=e885] [cursor=pointer]':
                              - /url: https://ars-els-cdn-com.eproxy.lib.hku.hk/content/image/1-s2.0-S1873506117301502-gr4_lrg.jpg
                          - listitem [ref=e888]:
                            - 'link "Download: Download full-size image" [ref=e889] [cursor=pointer]':
                              - /url: https://ars-els-cdn-com.eproxy.lib.hku.hk/content/image/1-s2.0-S1873506117301502-gr4.jpg
                      - paragraph [ref=e894]:
                        - text: Fig. 4. DMRT1 regulation of the mitosis/meiosis switch. (A) In wild-type animals, DMRT1 promotes spermatogonial differentiation by activating expression of
                        - emphasis [ref=e895]: Sohlh1
                        - text: and other differentiation genes in spermatogonia. DMRT1 also inhibits retinoic acid (RA) signaling and represses transcription of the RA-dependent gene
                        - emphasis [ref=e896]: Stra8
                        - text: to prevent mitotic germ cells from prematurely entering meiosis. DMRT1 is silenced in premeiotic germ cells (preleptotene spermatocytes) allowing expression of
                        - emphasis [ref=e897]: Stra8
                        - text: and meiotic entry. DMRT1-positive cells are indicated by red nucleus. (B) In
                        - emphasis [ref=e898]: Dmrt1
                        - text: mutants,
                        - emphasis [ref=e899]: Stra8
                        - text: and other meiosis-promoting factors are overexpressed in A1 spermatogonia, resulting in premature entry of meiosis, bypassing some or all of the spermatogonial proliferation program.
              - generic [ref=e900]:
                - heading "5. DMRT6 and the transition from mitotic to meiotic programs" [level=2] [ref=e901]
                - generic [ref=e902]:
                  - generic [ref=e903]:
                    - text: DMRT6 is expressed in type A, Intermediate, and type B differentiating spermatogonia and has an important role in coordinating spermatogonial differentiation, including the transition from the mitotic spermatogonial program to the meiotic spermatocytic program (
                    - link "Zhang et al., 2016" [ref=e904] [cursor=pointer]:
                      - /url: "#bb0285"
                    - generic [ref=e906]:
                      - text: ). DMRT6 has very similar
                      - link "DNA binding" [ref=e907] [cursor=pointer]:
                        - /url: /topics/biochemistry-genetics-and-molecular-biology/dna-binding
                      - text: preferences to DMRT1 in vivo and regulates some of the same genes, but it can have opposite effects on their expression. In post-SSC spermatogonia, DMRT1 promotes spermatogonial division and differentiation while DMRT6 helps to end the mitotic period and stimulate meiotic entry (
                    - link "Fig. 5" [ref=e908] [cursor=pointer]:
                      - /url: "#f0025"
                    - text: A). Like
                    - emphasis [ref=e910]: Dmrt1
                    - text: ","
                    - emphasis [ref=e911]: Dmrt6
                    - text: activity is sensitive to genetic background. In C57BL/6J mice
                    - emphasis [ref=e912]: Dmrt6
                    - text: mutant spermatogonia have stage-inappropriate expression of SOHLH1, SOHLH2 and DMRT1, and differentiating spermatogonia are lost through apoptosis, indicating that DMRT6 is essential for the completion of spermatogonial differentiation (
                    - link "Fig. 5" [ref=e913] [cursor=pointer]:
                      - /url: "#f0025"
                    - text: B). The few mutant spermatogonia that escape apoptosis in C57BL/6J mice enter meiosis, but they arrest in mid-pachynema and undergo apoptosis as spermatocytes, revealing that even though DMRT6 is not expressed in spermatocytes, its earlier function is essential for meiotic prophase. In 129Sv mice, most
                    - emphasis [ref=e915]: Dmrt6
                    - generic [ref=e916]:
                      - generic [ref=e917]:
                        - text: mutant spermatogonia escape apoptosis and enter meiosis in numbers similar to wild type, but they fail to complete meiosis, like the spermatogonia that escape earlier apoptosis in C57BL/6J mice. These
                        - link "mutant cells" [ref=e918] [cursor=pointer]:
                          - /url: /topics/biochemistry-genetics-and-molecular-biology/cell-mutant
                        - text: can induce double-strand breaks during meiotic prophase, but show a reduced number of intermediate nodules marked by MSH4. As a result, accumulation of recombination foci to form crossovers is disrupted. In addition, meiotic
                      - link "chromosome pairings" [ref=e919] [cursor=pointer]:
                        - /url: /topics/biochemistry-genetics-and-molecular-biology/synapsis
                      - text: are incomplete in mutant cells, with many cells in pachynema having several autosomal and sex chromosomes unpaired and unable to establish a normal XY body. Mutant cells arrest in mid-pachynema and undergo apoptosis, presumably due to checkpoint activation. mRNA profiling and ChIP-seq data suggest that DMRT6 directly represses genes required for spermatogonial differentiation, such as
                    - emphasis [ref=e920]: Sohlh1
                    - text: ","
                    - emphasis [ref=e921]: Sohlh2
                    - text: ","
                    - emphasis [ref=e922]: Dmrt1
                    - text: ","
                    - emphasis [ref=e923]: Ngn3
                    - text: ", and"
                    - emphasis [ref=e924]: c-kit
                    - text: and actives genes required for meiotic prophase, such as
                    - emphasis [ref=e925]: Sycp2
                    - text: . Regulation of these genes helps bring a coordinated end to spermatogonial proliferation and meiosis. Because
                    - emphasis [ref=e926]: Dmrt6
                    - generic [ref=e927]:
                      - text: mutant spermatocytes are unable to silence spermatogonial regulators with normal timing, the consequence is inappropriate co-expression of key regulators, for example STRA8 and
                      - link "SYCP3" [ref=e928] [cursor=pointer]:
                        - /url: /topics/biochemistry-genetics-and-molecular-biology/sycp3
                      - text: ". DMRT6 may oppose DMRT1 transcriptional activity quite directly to finish the spermatogonial program: ChIP-seq showed that the two proteins bind to many of the same locations in vivo, and ChIP-reChIP showed that they can bind concurrently to sites near"
                    - emphasis [ref=e929]: Dmrt1
                    - text: ","
                    - emphasis [ref=e930]: Sohlh1
                    - text: and
                    - emphasis [ref=e931]: Sohlh2
                    - text: . DMRT proteins can form heteromeric complexes on DNA in vitro (
                    - link "Murphy et al., 2007" [ref=e932] [cursor=pointer]:
                      - /url: "#bb0155"
                    - text: ) but how prevalent these are in vivo or what are the functional consequences remain unknown. A possible mechanism for the functional antagonism of DMRT1 and DMRT6 is that formation of DMRT1/DMRT6 mixed complexes may lead to repression of genes normally activated by DMRT1 when it binds on its own.
                  - figure [ref=e934]:
                    - generic [ref=e935]:
                      - img "Fig. 5" [ref=e936]
                      - list [ref=e937]:
                        - listitem [ref=e938]:
                          - 'link "Download: Download high-res image (200KB)" [ref=e939] [cursor=pointer]':
                            - /url: https://ars-els-cdn-com.eproxy.lib.hku.hk/content/image/1-s2.0-S1873506117301502-gr5_lrg.jpg
                        - listitem [ref=e942]:
                          - 'link "Download: Download full-size image" [ref=e943] [cursor=pointer]':
                            - /url: https://ars-els-cdn-com.eproxy.lib.hku.hk/content/image/1-s2.0-S1873506117301502-gr5.jpg
                    - paragraph [ref=e948]:
                      - text: Fig. 5. DMRT6 regulation of the spermatogonium/spermatocyte transition. (A) In wild-type mice, DMRT6 is expressed in A4, Intermediate and type B spermatogonia (blue), and helps turn off the mitotic program by repressing
                      - emphasis [ref=e949]: Dmrt1
                      - text: ","
                      - emphasis [ref=e950]: Sohlh1
                      - text: and
                      - emphasis [ref=e951]: Sohlh2
                      - text: . As a result, STRA8-positive (green bars) premeiotic cells are negative for DMRT1, SOHLH1 and SOHLH2 (red bars). (B) In
                      - emphasis [ref=e952]: Dmrt6
                      - text: mutants, DMRT1, SOHLH1 and SOHLH2 (red bars) expression are ectopically expressed in STRA8-positive cells (green bars).
              - generic [ref=e953]:
                - heading "6. DMRT7 and sex chromatin regulation" [level=2] [ref=e954]
                - generic [ref=e955]:
                  - generic [ref=e956]:
                    - generic [ref=e957]:
                      - text: Consistent with its expression in pachytene spermatocytes, DMRT7 is essential for
                      - link "meiotic prophase I" [ref=e958] [cursor=pointer]:
                        - /url: /topics/biochemistry-genetics-and-molecular-biology/meiotic-prophase-i
                      - text: (
                    - link "Kawamata and Nishimori, 2006" [ref=e959] [cursor=pointer]:
                      - /url: "#bb0060"
                    - text: ","
                    - link "Kim et al., 2007b" [ref=e961] [cursor=pointer]:
                      - /url: "#bb0080"
                    - text: ). Most
                    - emphasis [ref=e963]: Dmrt7
                    - text: mutant germ cells arrest in pachynema and undergo apoptosis, although a small proportion can progress to diplonema. DMRT7 protein is concentrated in the XY body (or sex body), a specialized and densely staining chromatin domain that contains the sex chromosomes during meiosis (
                    - link "Kim et al., 2007b" [ref=e964] [cursor=pointer]:
                      - /url: "#bb0080"
                    - generic [ref=e966]:
                      - generic [ref=e967]:
                        - text: ). Although DMRT7 localizes to the XY body, sex chromosome
                        - link "synapsis" [ref=e968] [cursor=pointer]:
                          - /url: /topics/biochemistry-genetics-and-molecular-biology/synapsis
                        - text: and recombination were normal in mutant cells, the XY body had normal morphology and meiotic sex chromosome silencing (MSCI) occurred normally. After meiosis I, the XY body is no longer visible but sex chromosome silencing persists and new chromatin marks are recruited to form a chromatin domain termed postmeiotic
                      - link "sex chromatin" [ref=e969] [cursor=pointer]:
                        - /url: /topics/biochemistry-genetics-and-molecular-biology/barr-body
                      - text: ", or PMSC, which persists throughout spermatid differentiation ("
                    - link "Namekawa et al., 2006" [ref=e970] [cursor=pointer]:
                      - /url: "#bb0175"
                    - text: ","
                    - link "Turner et al., 2006" [ref=e972] [cursor=pointer]:
                      - /url: "#bb0260"
                    - text: ). Normally sex chromatin accumulates H3K9me2 and H3K9me3 marks and HP1β protein as cells progress to diplonema (
                    - link "Fig. 6" [ref=e974] [cursor=pointer]:
                      - /url: "#f0030"
                    - text: A). However, in the rare mutant cells that survived to diplonema, these signatures of PMSC were absent and silencing of sex chromosome transcription was incomplete (
                    - link "Kim et al., 2007b" [ref=e976] [cursor=pointer]:
                      - /url: "#bb0080"
                    - text: ) (
                    - link "Fig. 6" [ref=e978] [cursor=pointer]:
                      - /url: "#f0030"
                    - text: B). Thus, it appears that DMRT7 is required for the transition between MSCI in pachynema and PMSC in diplonema. How DMRT7 mediates this transition is unclear. Because it is enriched in the cellular compartment containing the sex chromosomes it may bind sites on the sex chromosomes to help recruit chromatin modifiers specifically to these chromosomes. However, since some DMRT7 is found elsewhere in the nucleus, it also might regulate the expression of autosomal genes important for the MSCI to PMSC transition.
