                      - text: and homeostasis.
              - generic [ref=e553]:
                - heading "3. Sequential and dynamic expression of DMRT proteins in the testis" [level=2] [ref=e554]
                - generic [ref=e555]:
                  - generic [ref=e556]:
                    - generic [ref=e557]:
                      - text: In the mouse three of the seven DMRT proteins – DMRT1, DMRT6 and DMRT7 - are expressed in the testis and DMRT1 also is briefly expressed in the embryonic ovary. DMRT1 is expressed in both
                      - link "somatic cells" [ref=e558] [cursor=pointer]:
                        - /url: /topics/biochemistry-genetics-and-molecular-biology/somatic-cell
                      - text: and germ cells, while the other two are expressed only in germ cells. DMRT1 expression is particularly dynamic during germ cell development (summarized in
                    - link "Fig. 1" [ref=e559] [cursor=pointer]:
                      - /url: "#f0005"
                    - text: ","
                    - link "Fig. 2" [ref=e561] [cursor=pointer]:
                      - /url: "#f0010"
                    - text: ).
                    - emphasis [ref=e563]: Dmrt1
                    - generic [ref=e564]:
                      - text: mRNA expression is detectable by RT-PCR in whole E9.5 embryos and by E10.5 it is detectable by
                      - link "in situ hybridization" [ref=e565] [cursor=pointer]:
                        - /url: /topics/biochemistry-genetics-and-molecular-biology/in-situ-hybridization
                      - text: in the genital ridge (
                    - link "Raymond et al., 1999" [ref=e566] [cursor=pointer]:
                      - /url: "#bb0190"
                    - text: ). At the genital ridge stage
                    - emphasis [ref=e568]: Dmrt1
                    - text: mRNA is expressed in both germ cells and somatic cells, but DMRT1 protein is expressed mainly in somatic cells at E11.5, with similar levels in XX and XY animals (
                    - link "De Grandi et al., 2000" [ref=e569] [cursor=pointer]:
                      - /url: "#bb0020"
                    - text: ","
                    - link "Lei et al., 2007" [ref=e571] [cursor=pointer]:
                      - /url: "#bb0115"
                    - text: ","
                    - link "Raymond et al., 1999" [ref=e573] [cursor=pointer]:
                      - /url: "#bb0190"
                    - text: ). Somatic sex determination rapidly affects DMRT1 expression in somatic cells, with expression silenced in pre-granulosa cells of the embryonic ovary around E12.5 but continuing indefinitely in pre-Sertoli and Sertoli cells of the embryonic and postnatal testis (
                    - link "Lei et al., 2007" [ref=e575] [cursor=pointer]:
                      - /url: "#bb0115"
                    - text: ","
                    - link "Raymond et al., 2000" [ref=e577] [cursor=pointer]:
                      - /url: "#bb0195"
                    - text: ). By E12.5 DMRT1 protein is expressed in germ cells in both sexes (
                    - link "Lei et al., 2007" [ref=e579] [cursor=pointer]:
                      - /url: "#bb0115"
                    - text: ). In the ovary, DMRT1 disappears from germ cell nuclei by E14.5, corresponding to the mitosis to meiosis switch in the ovary (
                    - link "Krentz et al., 2011" [ref=e581] [cursor=pointer]:
                      - /url: "#bb0100"
                    - text: ","
                    - link "Lei et al., 2007" [ref=e583] [cursor=pointer]:
                      - /url: "#bb0115"
                    - text: ). In the testis, DMRT1 expression in germ cells is silenced around E15.5 and reactivated around P1, when germ cells re-enter mitosis and become migratory (
                    - link "Lei et al., 2007" [ref=e585] [cursor=pointer]:
                      - /url: "#bb0115"
                    - text: ","
                    - link "Raymond et al., 2000" [ref=e587] [cursor=pointer]:
                      - /url: "#bb0195"
                    - text: ). In the postnatal testis, DMRT1 is expressed in all mitotic spermatogonia, including SSCs and then silenced in preleptotene spermatocytes and not detected subsequently (in meiotic or postmeiotic spermatocytes and spermatids) (
                    - link "Matson et al., 2010" [ref=e589] [cursor=pointer]:
                      - /url: "#bb0130"
                    - text: ).
