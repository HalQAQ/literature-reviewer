                      - generic [ref=e645]:
                        - text: has revealed a surprising array of different DMRT1 functions and has shown that DMRT1 interacts with other regulatory factors whose activity varies between
                        - link "inbred mouse strains" [ref=e646] [cursor=pointer]:
                          - /url: /topics/biochemistry-genetics-and-molecular-biology/inbred-mouse-strain
                        - text: . On mixed strain backgrounds the first apparent phenotype in testes of
                    - emphasis [ref=e647]: Dmrt1
                    - text: null mutants occurs perinatally and affects both germ cells and Sertoli cells (
                    - link "Fahrioglu et al., 2007" [ref=e648] [cursor=pointer]:
                      - /url: "#bb0030"
                    - text: ","
                    - link "Kim et al., 2007a" [ref=e650] [cursor=pointer]:
                      - /url: "#bb0075"
                    - text: ","
                    - link "Raymond et al., 2000" [ref=e652] [cursor=pointer]:
                      - /url: "#bb0195"
                    - text: "). Prospermatogonia of null mutants appear developmentally arrested: they fail to reinitiate mitosis at birth, do not become migratory during the first few postnatal days, and then die by postnatal day 14 (P14) ("
                    - link "Fahrioglu et al., 2007" [ref=e654] [cursor=pointer]:
                      - /url: "#bb0030"
                    - text: ). Sertoli cells of null mutants appear normal at birth but fail to complete maturation. Strikingly, about two weeks postnatally
                    - emphasis [ref=e656]: Dmrt1
                    - generic [ref=e657]:
                      - text: mutant Sertoli cells undergo
                      - link "transdifferentiation" [ref=e658] [cursor=pointer]:
                        - /url: /topics/biochemistry-genetics-and-molecular-biology/transdifferentiation
                      - text: to their female counterparts, granulosa cells (
                    - link "Matson et al., 2011" [ref=e659] [cursor=pointer]:
                      - /url: "#bb0135"
                    - text: ","
                    - link "Minkina et al., 2014" [ref=e661] [cursor=pointer]:
                      - /url: "#bb0150"
                    - text: ). This unusual phenotype revealed that Sertoli cells require active maintenance of their sexual cell fate and also indicates that DMRT1 is dispensable to determine the Sertoli cell fate but essential to maintain it. Because Sertoli cells play a crucial role in germ line maintenance, the germ cell phenotype of null mutants could at least partly reflect deficient Sertoli cell function. Indeed, conditional deletion of
                    - emphasis [ref=e663]: Dmrt1
                    - text: just in Sertoli cells of mixed background mice disrupts germ cell development starting in meiotic prophase (
                    - link "Kim et al., 2007a" [ref=e664] [cursor=pointer]:
