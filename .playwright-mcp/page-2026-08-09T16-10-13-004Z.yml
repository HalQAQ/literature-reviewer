                      - text: ). Once sex is determined, development of male and female germ cells diverges. Female germ cells enter an oogenic program involving initiation of meiosis and arrest in
                      - link "prophase" [ref=e505] [cursor=pointer]:
                        - /url: /topics/biochemistry-genetics-and-molecular-biology/prophase
                      - text: I until puberty, while male germ cells restrict pluripotency and become mitotically quiescent prospermatogonia (proSGs) until birth.
