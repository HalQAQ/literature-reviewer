                    - paragraph [ref=e605]:
                      - text: Fig. 2. DMRT1 expression in the testis and ovary. DMRT1 protein (red) is expressed in both the somatic and germ cells of the female gonad starting around E11.5, and is gradually silenced in both cell types prior to meiosis. DMRT1 is expressed in male somatic cells of the gonad (presumptive pre-Sertoli cells) starting by ~ E11.5 and continues to be expressed in Sertoli cells thereafter. In male germ cells, DMRT1 is expressed from ~ E12.5, is silenced by E15.5, and is reactivated in postnatal germ cells, continuing to be expressed in adult spermatogonia (see
                      - link "Fig. 1" [ref=e606] [cursor=pointer]:
                        - /url: "#f0005"
                      - text: ).
