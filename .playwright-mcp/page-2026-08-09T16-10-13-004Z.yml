                - generic [ref=e545]:
                  - generic [ref=e546]:
                    - text: Because male gametogenesis is continuous and long-term, maintaining germ line
                    - link "homeostasis" [ref=e547] [cursor=pointer]:
                      - /url: /topics/biochemistry-genetics-and-molecular-biology/homeostasis
                    - text: requires precise modulation of differentiation and proliferation at a number of key developmental steps. Although a growing number of genes are now known to contribute to intrinsic and extrinsic regulation of germ cell development, control of many of the key events remains poorly understood. As described below, DMRT proteins are expressed during much of mouse gametogenesis, from PGCs to spermatocytes, and phenotypic analysis of
                  - emphasis [ref=e548]: Dmrt
